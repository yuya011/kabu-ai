name: TDnet Daily Fetch & Text Extraction

on:
  schedule:
    - cron: '0 9 * * 1-5'   # UTC 9:00 = JST 18:00 (月〜金)
  workflow_dispatch:         # 手動実行用トリガー

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pypdf

      - name: Fetch and extract TDnet texts (Last 3 days for safety)
        run: |
          python scripts/tdnet_scraper.py --days 3

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/tdnet_disclosures/
          git diff --staged --quiet || (git commit -m "chore(tdnet): auto-fetch disclosures $(date +%F)" && git push)
