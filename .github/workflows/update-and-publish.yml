# データを更新して GitHub Pages に公開する。
#
# 走らせ方は3通り。
#   ・毎日 06:00 JST      … サイトの作り直し（データは手元で更新して push する）
#   ・data/** への push   … 手元で有報を取り込んで push したときに作り直す
#   ・手動                … Run workflow から
#
# ニュースの収集はここでは行わない。Google ニュースは利用規約が
# robot による取得・再表示・商用利用を禁じており、robots.txt も /rss/ を
# Disallow にしている。手元での私的利用に留め、配信物には含めない。
#
# 有価証券報告書はここでは取り込めない。EDINET API は GitHub Actions のランナー
# （Azure のデータセンター IP）からのアクセスを 403 で拒否する。鍵の有無とは無関係で、
# 鍵を渡さなくても手元からは 200 が返る一方、CI からは全日付が 403 になる。
# よって有報は手元で scripts/update_edinet_local.sh を実行して push する運用にしている。
# push を契機にこのワークフローが動き、サイトが作り直される。
#
# 生成物（frontend/public/data/browser）はコミットしない。ここで作り直す。
# コミットするのは取り込んだ生データだけで、倉庫も JSON もそこから再構築できる。
name: データ更新と公開

on:
  schedule:
    - cron: '0 21 * * *'   # 毎日 06:00 JST
  push:
    branches: [main]
    paths:
      - 'data/**'          # 手元で取り込んだ有報を push したとき
      - 'frontend/**'      # 画面を直したとき
      - 'scripts/**'       # 書き出しの内容を変えたとき
      - 'src/**'
      - '.github/workflows/update-and-publish.yml'
  workflow_dispatch:
    inputs:
      edinet:
        description: '有報の取り込みも試す（CI からは 403 で失敗する。通常はオフ）'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

# 同時に走らせるとデータのコミットが衝突する
concurrency:
  group: update-and-publish
  cancel-in-progress: false

env:
  EDINET_RUN: ${{ inputs.edinet == true }}

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 依存関係
        run: pip install -r requirements.txt

      # 提出書類の一覧は過去日ぶんが変わらないので持ち越す。
      # 書類そのもの(data/edinet_cache)は台帳で二度取りを防げるため持ち越さない。
      - name: 提出書類一覧のキャッシュ
        if: env.EDINET_RUN == 'true'
        uses: actions/cache@v4
        with:
          path: data/edinet_raw/doclist
          key: edinet-doclist-${{ github.run_id }}
          restore-keys: edinet-doclist-

      # EDINET は CI の IP を拒否するため、失敗しても後続を止めない。
      # ニュースの更新とサイトの公開は独立して完了させる。
      - name: 有価証券報告書の取り込み（CI では失敗する想定）
        if: env.EDINET_RUN == 'true'
        continue-on-error: true
        env:
          EDINET_API: ${{ secrets.EDINET_API }}
        run: python scripts/edinet_ingest.py --months 14

      # --public で J-Quants 由来（決算・サプライズ・市場区分・TOPIX規模区分）を外す。
      # J-Quants の規約は「本データを第三者が閲覧できる状態」を私的利用と認めておらず、
      # 公開サイトに載せることも、運営側サーバーに蓄積・中継することも禁じている。
      # 公開版は EDINET と Google ニュースだけで組み立てる。
      - name: 倉庫の構築と JSON の書き出し（公開版）
        run: |
          python scripts/build_warehouse.py --public
          python scripts/export_browser_json.py

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: フロントエンドのビルド
        working-directory: frontend
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_PUBLIC: '1'
          # 閲覧統計の送り先。未設定なら何も送らない（worker/ を参照）
          VITE_ANALYTICS_URL: https://kabu-stats.yuya011.workers.dev
        run: |
          npm ci
          npm run build

      # Pages が未設定でも自前で有効化する。設定画面での操作を不要にするため。
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      # データのコミットは最後に回す。ここで失敗しても、
      # サイトの成果物は既にアップロード済みで公開まで進める。
      # 取り込みに10分以上かかるので、その間に main が進んでいることがある。
      # そのまま push すると non-fast-forward で弾かれ、取り込んだぶんが丸ごと無駄になる。
      # rebase してから押し直す。
      #
      # なお、ここでの push は GITHUB_TOKEN によるものなので、
      # data/** の push トリガーでこのワークフローが再帰的に起動することはない。
      - name: 取り込んだ生データをコミット
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A data/edinet_raw data/edinet_codelist
          if git diff --cached --quiet; then
            echo "更新なし"
            exit 0
          fi
          git commit -m "chore: データ更新 $(date -u '+%Y-%m-%d')"

          for attempt in 1 2 3; do
            if git push origin HEAD:"$BRANCH"; then
              echo "push しました（$attempt 回目）"
              exit 0
            fi
            echo "push が弾かれました。リモートを取り込んで再試行します（$attempt 回目）"
            git pull --rebase --autostash origin "$BRANCH" || {
              echo "::error::rebase に失敗しました。手元で解消してください"
              exit 1
            }
            sleep $((attempt * 5))
          done
          echo "::error::3回試しても push できませんでした"
          exit 1
        env:
          BRANCH: ${{ github.ref_name }}

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
